# ===== Multi-Strategy Trading System configuration =====

symbol: BTCUSDT
timeframe: "15"          # kline interval (minutes); Phase 1 sets this to the validated timeframe
testnet: true            # KEEP true until the system has run clean for weeks

# ---- Strategies ----
# A strategy may only be enabled after passing backtest/BACKTEST.md.
# Lower priority number wins if two strategies fire on the same candle.
strategies:
  sweep:                       # mean-reversion: liquidity sweep & reject
    enabled: true
    priority: 1
    params:
      lookback_candles: 192
      swing_strength: 2
      equal_level_tolerance_pct: 0.05
      min_wick_pct: 25
    bracket:
      stop_beyond_pct: 0.1     # SL buffer beyond stop_hint
      fixed_rr: 2.5
    allowed_vol_regimes: [low, normal]  # realized-vol rank filter (regime.py)
    regime_filter:
      enabled: true
      ema_period: 50
      atr_period: 14
      trend_threshold: 0.3     # dimensionless slope; tune via sensitivity.py
      allowed_regimes: [ranging]  # mean-reversion only in non-trending markets

  breakout:                    # momentum: first close beyond N-candle range
    enabled: false             # <- enable ONLY after it passes BACKTEST.md
    priority: 2
    params:
      range_lookback: 48
      atr_period: 14
      min_body_atr: 1.2
    bracket:
      stop_beyond_pct: 0.1
      fixed_rr: 2.0
    regime_filter:
      enabled: false           # enable after breakout passes validation
      ema_period: 50
      atr_period: 14
      trend_threshold: 0.3
      allowed_regimes: [trending_up, trending_down]  # momentum only in trends

  trend_pullback:              # trend-following: buy the dip in an uptrend
    enabled: false
    priority: 3
    params:
      ema_fast: 21
      ema_slow: 55
    bracket:
      stop_beyond_pct: 0.1
      fixed_rr: 2.0
    regime_filter:
      enabled: false
      ema_period: 50
      atr_period: 14
      trend_threshold: 0.3
      allowed_regimes: [trending_up, trending_down]

  rsi_reversion:               # mean-reversion: fade RSI extremes with reversal trigger
    enabled: false
    priority: 4
    params:
      rsi_period: 14
      oversold: 30
      overbought: 70
    bracket:
      stop_beyond_pct: 0.1
      fixed_rr: 2.0
    allowed_vol_regimes: [low, normal]  # realized-vol rank filter (regime.py)
    regime_filter:
      enabled: false
      ema_period: 50
      atr_period: 14
      trend_threshold: 0.3
      allowed_regimes: [ranging]

  vol_squeeze:                 # volatility compression -> expansion breakout
    enabled: false
    priority: 5
    params:
      bb_period: 20
      squeeze_lookback: 64
      squeeze_pct: 25
    bracket:
      stop_beyond_pct: 0.1
      fixed_rr: 2.0
    allowed_vol_regimes: [low, normal]  # realized-vol rank filter (regime.py)
    regime_filter:
      enabled: false           # squeeze fires at regime transitions; leave open

  zscore_reversion:            # statistical mean-reversion on rolling z-score
    enabled: false
    priority: 6
    params:
      lookback: 96
      z_entry: 2.0
    bracket:
      stop_beyond_pct: 0.1
      fixed_rr: 2.0
    allowed_vol_regimes: [low, normal]  # realized-vol rank filter (regime.py)
    regime_filter:
      enabled: false
      ema_period: 50
      atr_period: 14
      trend_threshold: 0.3
      allowed_regimes: [ranging]

# ---- Agent backend -------------------------------------------------------
# Select which AI agent framework runs the trading pipeline.
# Swap `backend` to switch frameworks; credentials are read from env vars.
#
# Backends:
#   claude_code        — Claude Code CLI (default; requires `claude` on PATH)
#   openai             — OpenAI API  (set OPENAI_API_KEY)
#   openai_compatible  — any OpenAI-compatible endpoint (Ollama, LM Studio,
#                        Hermes, OpenClaw — set api_key_env + base_url)
#   http               — fully generic HTTP POST (Hermas, custom agents)
# -------------------------------------------------------------------------
agent:
  backend: claude_code          # change this to switch frameworks

  # ---- Claude Code CLI ----
  claude_code:
    executable: claude          # path to claude binary (or just "claude" if on PATH)
    allowed_tools:
      - "mcp__bybit__*"
      - Read
      - Write
      - Edit
      - WebFetch
      - WebSearch
      - Task
    max_turns: 30
    output_format: json
    timeout_sec: 600
    # system_prompt_file: ORCHESTRATOR.md   # optional: explicit system prompt file

  # ---- OpenAI / Codex / o-series ----
  openai:
    api_key_env: OPENAI_API_KEY           # env var that holds the key
    base_url: https://api.openai.com/v1   # change for proxies / Azure
    model: gpt-4o
    max_tokens: 16000
    temperature: 0
    timeout_sec: 600
    system_prompt_file: ORCHESTRATOR.md   # universal system prompt

  # ---- OpenAI-compatible  (Ollama, LM Studio, Hermes, OpenClaw …) ----
  openai_compatible:
    api_key_env: AGENT_API_KEY            # env var (use "none" if no auth)
    base_url: http://localhost:11434/v1   # example: Ollama default port
    model: llama3                         # replace with your model name
    max_tokens: 16000
    temperature: 0
    timeout_sec: 600
    system_prompt_file: ORCHESTRATOR.md

  # ---- Generic HTTP POST  (Hermas, custom agent servers) ----
  http:
    url: http://localhost:8080/run        # agent endpoint
    timeout_sec: 600
    system_prompt_file: ORCHESTRATOR.md
    # headers:
    #   Authorization: "Bearer ${AGENT_API_KEY}"   # ${VAR} expands from env
    # body_template: '{"prompt":"{prompt}","system":"{system}"}'
    # response_field: output              # dot-path to text in the JSON response

# ---- Invocation timing (shared across all backends) ----
invoke_timeout_sec: 600
invoke_cooldown_sec: 900       # never invoke more than once per candle

# ---- Risk rules (SHARED across ALL strategies — hard ceilings) ----
# risk_engine.py enforces these and can only size DOWN from them, never up.
risk:
  risk_per_trade_pct: 1.0      # ceiling; quarter-Kelly + streak throttle reduce it
  max_open_positions: 1        # total, across all strategies
  max_daily_loss_pct: 3.0      # total, across all strategies
  max_weekly_loss_pct: 6.0     # rolling 7-day; breach = no new trades for 48h
  equity_floor_pct: 50         # equity < 50% of starting equity = hard halt + alert
  min_rr: 2.0
  max_leverage: 3

# ---- Alerts (critical events only — alert fatigue is a failure mode) ----
# Requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID environment variables.
# System runs fine with enabled: false; would-be alerts land in logs/alerts.log.
alerts:
  enabled: false
  channel: telegram

# ---- Event guard ----
events:
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  watch: [FOMC, CPI, NFP, PPI, FED_SPEECH]

# ---- Strategy health monitor (Phase 3 + live) ----
monitor:
  degradation_threshold_pct: 50   # flag if live exp < 50% of backtest exp
  drawdown_alert_multiple: 1.5    # flag if live DD > 1.5x backtest max DD
  min_trades_for_comparison: 50   # don't compare until N live trades exist

# ---- Autonomous operation ----
# Set once; agent handles everything else with no human gates.
autonomous:
  auto_go_live: false          # set true to allow agent to flip testnet: false after validation
  auto_enable_strategies: true # automatically set enabled: true after all 4 gates pass
  auto_disable_degraded: true  # automatically set enabled: false on DISABLE_RECOMMENDED
  auto_write_env: true         # auto-create .env from BYBIT_API_KEY/SECRET env vars

# ---- Strategy discovery (Phase 1 search space) ----
# The agent searches strategies x symbols x timeframes until something passes
# the FULL validation suite honestly. The acceptance bar itself never changes.
discovery:
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  timeframes: ["15", "60"]     # Bybit kline intervals (minutes)
  data_days: 365
  refresh_days: 7              # re-fetch data and re-validate this often
